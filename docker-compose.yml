version: '3.8'

services:
  bushfire-memory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bushfire-memory-server
    ports:
      - "8080:8080"
    volumes:
      - cache-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cache-data:
